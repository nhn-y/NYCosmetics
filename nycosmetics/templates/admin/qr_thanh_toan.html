{% extends 'layout/base.html' %}

{% block content %}

<link
    rel="stylesheet"
    href="{{ url_for(
        'static',
        filename='css/admin.css'
    ) }}"
>

<div class="container text-center mt-5">

    <h3>
        📱 QUÉT MÃ QR ĐỂ THANH TOÁN
    </h3>

    <p>
        Số tiền:
        <strong>
            {{
                "{:,.0f}".format(
                    total_price
                )
            }}đ
        </strong>
    </p>


    <img
        src="{{ qr_url }}"
        alt="Mã QR thanh toán"
        class="img-fluid"
        style="max-width: 350px;"
    >


    <p class="mt-3 text-muted">

        Vui lòng kiểm tra lại số tiền
        trước khi chuyển khoản.

    </p>


    <a
            href="{{ url_for(
                'staff_cart'
            ) }}"
            class="btn btn-primary"
    >

        ← Quay lại giỏ hàng

    </a>

</div>

{% endblock %}
