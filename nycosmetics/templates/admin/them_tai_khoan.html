{% extends 'layout/base.html' %}

{% block content %}

<link
    rel="stylesheet"
    href="{{ url_for(
        'static',
        filename='css/admin.css'
    ) }}"
>

<div class="container mt-4">

    <h2>
        Thêm tài khoản
    </h2>

    <form
        method="POST"
    >

        <div class="row">

            <div class="col-md-6 mb-3">

                <label>
                    Họ và tên
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    required
                >

            </div>


            <div class="col-md-6 mb-3">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required
                >

            </div>

        </div>


        <div class="row">

            <div class="col-md-6 mb-3">

                <label>
                    Mật khẩu
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required
                >

            </div>


            <div class="col-md-6 mb-3">

                <label>
                    Loại tài khoản
                </label>

                <select
                    name="role"
                    class="form-select"
                    required
                >

                    <option value="">
                        Chọn loại tài khoản
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                    <option value="nhanVien">
                        Nhân viên
                    </option>

                </select>

            </div>

        </div>


        <div class="row">

            <div class="col-md-6 mb-3">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                >

            </div>


            <div class="col-md-6 mb-3">

                <label>
                    Số điện thoại
                </label>

                <input
                    type="text"
                    name="dienThoai"
                    class="form-control"
                >

            </div>

        </div>


        <button
            type="submit"
            class="btn btn-success"
        >
            Thêm tài khoản
        </button>


        <a
            href="{{ url_for('account_management') }}"
            class="btn btn-secondary"
        >
            Hủy
        </a>

    </form>

</div>

{% endblock %}
