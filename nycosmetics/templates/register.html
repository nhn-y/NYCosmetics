<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{%block title%}Đăng Ký{%endblock%}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}?v=1.2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ĐĂNG KÝ</title>
</head>

{%block content%}

<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <h3 style="color:#A56EFF;" class="text-center mb-4">ĐĂNG KÝ</h3>

        {% if err_msg %}
        <div class="alert alert-danger">{{err_msg}}</div>
        {% endif %}

        <form method="post" action="/register" enctype="multipart/form-data">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="name" placeholder="Nhập họ tên" name="name" required>
                <label for="name">Nhập họ tên</label>
            </div>

            <div class="form-floating mb-3">
                <input type="text" class="form-control"
                       id="username"
                       placeholder="Nhập tên tài khoản"
                       name="username"
                       pattern="^[A-Za-z0-9]+$"
                       title="Chỉ được nhập chữ và số, không khoảng trắng, không ký tự đặc biệt."
                       required>
                <label for="username">Nhập tên tài khoản</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control"
                       id="password"
                       placeholder="Nhập mật khẩu"
                       name="password"
                       pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$"
                       title="Mật khẩu phải có ít nhất 8 ký tự. Gồm chữ hoa, chữ thường, số, ký tự đặc biệt."
                       required>
                <label for="password">Nhập mật khẩu</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="confirm" placeholder="Nhập lại mật khẩu" name="confirm" required>
                <label for="confirm">Nhập lại mật khẩu</label>
            </div>

            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="Nhập email" name="email" required>
                <label for="email">Nhập email</label>
            </div>

            <div class="form-floating mb-3">
                <input type="file" class="form-control" id="avatar" placeholder="Ảnh đại diện" name="avatar">
                <label for="avatar">Ảnh đại diện</label>
            </div>

            <div class="d-flex justify-content-center mt-3">
                <button class="btn px-5" type="submit" style="background:#A56EFF; color:white;">ĐĂNG KÝ</button>
            </div>
        </form>
    </div>
</div>

{%endblock%}
